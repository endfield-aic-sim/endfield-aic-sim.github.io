<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="엔드필드 AIC 시뮬레이터">
<meta property="og:description" content="명일방주: 엔드필드 AIC 공장을 브라우저에서 짜 보고 분당·시간당 생산량을 확인하는 비공식 팬 제작 시뮬레이터">
<meta name="theme-color" content="#15191A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2315191A'/%3E%3Cpath d='M0 26 26 0h6L6 32H0z M12 32 32 12v6L18 32z' fill='%23F2D300'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%23F3F4F1'/%3E%3C/svg%3E">
<title>엔드필드 AIC 시뮬레이터</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E3E6E2; --panel:#F3F4F1; --panel-2:#E9ECE7; --ink:#15191A; --muted:#58615C; --line:#C6CBC4;
  --accent:#F2D300; --accent-ink:#6B5C00; --on-accent:#15191A;
  --power:#12806F; --ok:#2B8A3E; --warn:#C26A00; --bad:#C0262D;
  --cv-bg:#D5D9D3; --cv-grid:rgba(21,25,26,.055); --cv-grid2:rgba(21,25,26,.12);
  --cv-belt:#3B4241; --cv-rail:#262B2A; --cv-belt-mark:#8C9591; --cv-pipe:#2E6F72; --cv-pipe-core:#7FC4C4;
  --cv-mach:#F8F9F6; --cv-mach-ink:#1B2021; --cv-range:rgba(18,128,111,.09); --cv-range-line:rgba(18,128,111,.45);
  --f-display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101312; --panel:#171B1A; --panel-2:#1E2321; --ink:#E5E8E3; --muted:#8D9690; --line:#2B312F;
    --accent:#F2D300; --accent-ink:#F2D300; --on-accent:#15191A;
    --power:#2DB3A0; --ok:#51CF66; --warn:#F59F00; --bad:#FF6B6B;
    --cv-bg:#0D100F; --cv-grid:rgba(229,232,227,.035); --cv-grid2:rgba(229,232,227,.075);
    --cv-belt:#343B39; --cv-rail:#1A1F1D; --cv-belt-mark:#6B7571; --cv-pipe:#245C5E; --cv-pipe-core:#5FB0B0;
    --cv-mach:#1D2220; --cv-mach-ink:#E5E8E3; --cv-range:rgba(45,179,160,.08); --cv-range-line:rgba(45,179,160,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101312; --panel:#171B1A; --panel-2:#1E2321; --ink:#E5E8E3; --muted:#8D9690; --line:#2B312F;
  --accent:#F2D300; --accent-ink:#F2D300; --on-accent:#15191A;
  --power:#2DB3A0; --ok:#51CF66; --warn:#F59F00; --bad:#FF6B6B;
  --cv-bg:#0D100F; --cv-grid:rgba(229,232,227,.035); --cv-grid2:rgba(229,232,227,.075);
  --cv-belt:#343B39; --cv-rail:#1A1F1D; --cv-belt-mark:#6B7571; --cv-pipe:#245C5E; --cv-pipe-core:#5FB0B0;
  --cv-mach:#1D2220; --cv-mach-ink:#E5E8E3; --cv-range:rgba(45,179,160,.08); --cv-range-line:rgba(45,179,160,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:auto minmax(0,1fr) auto}
header.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none;background:repeating-linear-gradient(135deg,var(--accent) 0 5px,var(--ink) 5px 10px);border-radius:3px;position:relative}
.brand .mark::after{content:"";position:absolute;inset:6px;background:var(--panel);border-radius:1px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:5px 10px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:5px 9px;font-family:var(--f-mono);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:64px;font-variant-numeric:tabular-nums}
.pwr{display:flex;align-items:center;gap:8px;min-width:190px}
.pwr .lbl{font-size:11px;color:var(--muted);letter-spacing:.04em}
.meter{position:relative;flex:1;height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:80px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--power);transition:width .3s}
.meter.over i{background:var(--bad)}
.pwr b{font-family:var(--f-mono);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spacer{flex:1}
select.sel{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:5px 8px;max-width:220px}
input.num{width:58px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:4px 6px;font-family:var(--f-mono);font-size:12px}

.build{grid-column:1;grid-row:3;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.brow{display:flex;align-items:flex-end;gap:12px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:4px;padding-bottom:8px;flex:none}
.tools button{display:flex;flex-direction:column;align-items:center;gap:1px;width:46px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:4px 2px 3px;font-size:10.5px;line-height:1.2}
.tools button canvas{width:18px;height:18px}
.tools button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink),inset 0 -3px 0 var(--accent);font-weight:600}
.cats{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:baseline;gap:6px;border:1px solid transparent;border-bottom:0;background:transparent;border-radius:5px 5px 0 0;padding:8px 14px 9px;margin-bottom:-1px;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.cats button:hover{color:var(--ink)}
.cats button[aria-selected="true"]{background:var(--panel-2);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.cats .cnt{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--muted)}
.search{flex:none;width:210px;padding-bottom:8px}
.search input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:5px 8px;font-size:12.5px}
.strip{display:flex;align-items:stretch;gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;background:var(--panel-2);min-height:124px;scroll-padding-inline:12px;overscroll-behavior-x:contain}
.tool{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:9px 6px 7px}
.tool:hover{border-color:var(--muted)}
.tool[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tool canvas{width:36px;height:36px;flex:none}
.tool .nm{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;word-break:keep-all;overflow-wrap:anywhere}
.tool .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:auto}
.tool.addbp{justify-content:center;border-style:dashed}
.tool.addbp .plus{font-size:24px;line-height:1;color:var(--muted)}
.tool.addbp .nm{min-height:0}
.bp{flex:none;width:210px;border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;background:var(--panel)}
.bp b{font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.bp .dim{font-size:11px}
.bp .row{gap:4px;margin-top:auto}
.snote{flex:none;align-self:center;max-width:260px;margin:0 4px;font-size:11.5px}
.keys{font-size:11px;color:var(--muted);padding:5px 12px 6px;line-height:1.6;border-top:1px solid var(--line)}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel-2);color:var(--ink)}

main.stage{grid-column:1;grid-row:2;position:relative;min-width:0;min-height:0;background:var(--cv-bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.float{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.float .btn{background:var(--panel)}
.selbar{position:absolute;left:12px;top:12px;right:190px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;box-shadow:0 2px 0 rgba(0,0,0,.06);max-width:760px}
.selbar b{font-weight:600;font-size:12.5px;margin-right:4px}
.selbar input{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:3px 7px;font-size:12px;width:160px}
.hud{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;align-items:flex-end;pointer-events:none;flex-wrap:wrap}
.hud .chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;max-width:100%}
.hud .chip.warn{border-color:var(--bad);color:var(--bad);font-weight:600}
.hud .mono{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

aside.side{grid-column:2;grid-row:2/4;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.insp{padding:12px 14px;border-bottom:1px solid var(--line);max-height:50%;overflow-y:auto;flex:none}
.insp h3{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0;line-height:1.2}
.insp .en{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.insp p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-working{color:var(--ok)} .st-idle{color:var(--muted)} .st-blocked,.st-slow{color:var(--warn)} .st-nopower,.st-nogas,.st-nocat{color:var(--bad)} .st-off{color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;border:1px dashed var(--muted);color:var(--muted);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle;font-family:var(--f-body);font-weight:400}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:17px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.sub{font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.sub span{text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.bufs{display:flex;flex-wrap:wrap;gap:5px}
.buf{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:2px 6px 2px 3px;font-size:11.5px;font-variant-numeric:tabular-nums}
.buf img{width:16px;height:16px}
.prog{height:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ink);width:0}
.rlist{display:flex;flex-direction:column;gap:4px}
.rec{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;font-size:11.5px;background:var(--panel)}
.rec.on{border-color:var(--ink);background:var(--panel-2)}
.rec .ar{color:var(--muted)}
.rec .t{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.ic{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ic img{width:15px;height:15px}
.ports{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;margin-top:6px}
.ports label{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ports select,.ports input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:3px;padding:3px 5px;font-size:12px}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;font-weight:500;border-bottom:2px solid transparent;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 16px}
.pane h4{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.06em;margin:14px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pane h4 small{font-family:var(--f-body);font-weight:400;letter-spacing:0;color:var(--muted);font-size:11px}
.tscroll{overflow-x:auto}
table.dep{width:100%;border-collapse:collapse;font-size:12px}
table.dep th{font-weight:500;color:var(--muted);font-size:11px;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dep th:first-child{text-align:left}
table.dep td{padding:4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
table.dep td:first-child{text-align:left;font-family:var(--f-body);font-size:12px;white-space:normal}
td .ic img{width:16px;height:16px}
table.dep tr.empty td{color:var(--muted);text-align:left;font-family:var(--f-body)}
.pos{color:var(--ok)} .neg{color:var(--warn)} .dim{color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin:8px 0 0;max-width:60ch}
details{margin-top:12px}
details summary{cursor:pointer;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.06em}
.form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.form select,.form input{border:1px solid var(--line);background:var(--panel-2);border-radius:3px;padding:4px 6px;font-size:12px}
.form input[type=number]{width:72px;font-family:var(--f-mono)}
.frow{display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:3px}
.frow:hover{background:var(--panel-2)}
.frow.on{background:var(--panel-2);outline:1px solid var(--ink)}
.frow img{width:18px;height:18px}
.frow .nm{font-size:12px;line-height:1.25}
.frow .nm small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tree{list-style:none;margin:10px 0 0;padding:0;font-size:12px}
.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line)}
.tree li{padding:3px 0}
.tree .n{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tree .m,.mchip{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.mchip{display:inline-block;margin:0 4px 4px 0;padding:1px 6px}
.tree .r{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}

dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:16px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{font-family:var(--f-display);margin:0 0 8px;font-size:16px}
dialog textarea{width:100%;height:200px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);padding:8px;resize:vertical}
.msg{font-size:12px;color:var(--muted);min-height:1.4em;margin-top:6px}

@media (max-width: 960px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto}
  main.stage,.build,aside.side{grid-column:1;grid-row:auto}
  .brow{flex-wrap:wrap;padding-inline:16px;gap:8px}
  .search{order:-1;width:auto;flex:1 1 180px}
  .cats{flex-basis:100%;order:2}
  .strip{padding-inline:16px;min-height:0}
  .keys{display:none}
  main.stage{height:62vh;min-height:360px}
  .selbar{right:12px;top:auto;bottom:48px}
  aside.side{border-left:0;border-top:1px solid var(--line)}
  .insp{max-height:none;padding-inline:16px}
  .pane{max-height:none;overflow:visible;padding-inline:16px}
  .pwr{min-width:160px;flex:1}
  .spacer{display:none}
}
@media (prefers-reduced-motion: reduce){ .meter i,.switch input::after, }
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div><h1>AIC 공장 시뮬레이터</h1><small>Arknights: Endfield · 협곡 IV / 무릉</small></div>
    </div>
    <div class="ctl">
      <button class="btn primary" id="play">일시정지</button>
      <div class="seg" id="speed" role="group" aria-label="배속">
        <button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="4" aria-pressed="false">4×</button><button data-s="8" aria-pressed="false">8×</button>
      </div>
      <span class="clock" id="clock">T+00:00</span>
    </div>

  dlgMode = mode; $('#dlgMsg').textContent = '';
  if (mode==='layout'){ $('#dlgTitle').textContent = '레이아웃 코드'; $('#dlgNote').textContent = '공장 전체를 코드로 옮깁니다. 복사해 두었다가 붙여넣고 불러오면 같은 공장이 됩니다. 작업 내용은 자동으로도 저장됩니다.'; $('#dlgText').value = enc(world.serialize()); $('#dlgLoad').textContent = '붙여넣은 코드 불러오기'; $('#dlgLoad').hidden = false; }
  else if (mode==='bpcode'){ $('#dlgTitle').textContent = `청사진 코드 · ${bp.name}`; $('#dlgNote').textContent = '이 코드를 다른 기기로 옮기거나 친구에게 보내면 "코드로 가져오기"로 같은 청사진을 쓸 수 있습니다.'; $('#dlgText').value = enc({ name: bp.name, bp: bp.bp }); $('#dlgLoad').hidden = true; }
  else { $('#dlgTitle').textContent = '청사진 가져오기'; $('#dlgNote').textContent = '청사진 코드를 붙여넣으세요.'; $('#dlgText').value = ''; $('#dlgLoad').textContent = '청사진으로 저장'; $('#dlgLoad').hidden = false; }
  dlg.showModal();
}
$('#io').onclick = () => openDialog('layout');
$('#dlgClose').onclick = () => dlg.close();
$('#dlgCopy').onclick = () => {
  const ta = $('#dlgText'); const fallback = () => { ta.select(); $('#dlgMsg').textContent = '자동 복사가 막혀 있어 텍스트를 선택해 두었습니다. Ctrl+C로 복사하세요.'; };
  try { navigator.clipboard.writeText(ta.value).then(() => { $('#dlgMsg').textContent = '복사했습니다.'; }, fallback); } catch(e){ fallback(); }
};
$('#dlgLoad').onclick = async () => {
  try {
    const o = dec($('#dlgText').value);
    if (dlgMode==='layout'){ const wo = o.ents ? o : o.world; if (!wo || !wo.ents) throw 0; ui.presetNote = null; loadWorld(AIC.deserialize(wo)); markTouched(); dlg.close(); }
    else { const bp = o.bp || o; if (!bp.ents) throw 0; await store.addBp(o.name || '가져온 청사진', bp); dlg.close(); setCat('bp'); flash('청사진을 가져왔습니다'); }
  } catch(e){ $('#dlgMsg').textContent = '읽을 수 없는 코드입니다. 복사한 코드 전체를 붙여넣었는지 확인하세요.'; }
};

function recipeRow(r, on){
  const ins = Object.entries(r.in).map(([k,n]) => icS(k, n)).join(' + ');
  const outs = Object.entries(r.out).map(([k,n]) => icS(k, n)).join(' + ') || '<span class="dim">폐기</span>';
  const gasTag = r.gas ? ` <span class="t" title="이 기체 환경(기체 분산기 범위) 안에서만 작동">${esc(ITEMS[r.gas].ko)} 환경</span>` : '';
  return `<div class="rec${on?' on':''}" title="${esc(Object.keys(r.out).map(k => ITEMS[k].ko).join(', '))}">${ins} <span class="ar">→</span> ${outs} <span class="t">${r.t}s</span>${gasTag}</div>`;
}
function bufList(buf, cap){
  const ks = Object.keys(buf||{}).filter(k => buf[k] > 0);
  if (!ks.length) return '<span class="dim">비어 있음</span>';
  return ks.map(k => `<span class="buf" title="${esc(ITEMS[k].en)}"><img alt="" src="${iconURL(k)}">${esc(ITEMS[k].ko)} <b>${buf[k]}</b>${cap&&cap[k]?`<span class="dim">/${cap[k]}</span>`:''}</span>`).join('');
}
function head(t, e){
  return `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>${esc(t.ko)}${t.wuling?'<span class="tag">무릉</span>':''}${t.est?'<span class="tag" title="크기나 전력을 자료에서 확인하지 못해 추정한 값입니다">크기 추정</span>':''}</h3><div class="en">${esc(t.en)} · ${t.sizeLabel || (t.w+'×'+t.h)}${t.power?` · 전력 ${t.power}`:''}${e?` · (${e.x}, ${e.y})`:''}</div></div>${e?'<span id="ipill"></span>':''}</div>`;
}

function itemOptions(sel, carrier, emptyLabel){

}

  const old = el.querySelector('#fq'), q = old ? old.value : '';
  const list = [...world.ents.values()].filter(e => !CARRIER.has(K(e.type)) && K(e.type) !== 'bus');
  const ql = q.trim().toLowerCase();
  let h = `<div class="form"><input id="fq" type="search" placeholder="배치한 설비 찾기" aria-label="배치한 설비 찾기" value="${esc(q)}" style="flex:1"></div>`;
  let any = false;
  for (const [gid, gnm] of [['core','코어'], ...GROUPS]){
    const items = list.filter(e => (TYPES[e.type].group || 'core') === gid && (!ql || TYPES[e.type].ko.toLowerCase().includes(ql) || TYPES[e.type].en.toLowerCase().includes(ql)));
    if (!items.length) continue; any = true;
    items.sort((a,b) => a.type.localeCompare(b.type) || a.y - b.y || a.x - b.x);
    const on = items.filter(e => !e.off).length;
    h += `<h4>${gnm} <small>${items.length}대${on < items.length ? ` · 꺼짐 ${items.length-on}` : ''}</small></h4>`;
    for (const e of items){
      const t = TYPES[e.type];
      const icon = K(e.type)==='machine' ? (e.cur ? rItem(e.cur) : e.last ? rItem(e.last) : firstOut(e.type)) : K(e.type)==='miner' ? e.ore : (t.makes || null);
      const st = e.status ? `<span class="pill st-${e.status}">${STLABEL[e.status]}</span>` : '<span></span>';
      h += `<div class="frow${ui.sel===e.id?' on':''}" data-id="${e.id}">${icon ? `<img alt="" src="${iconURL(icon)}">` : '<span></span>'}<span class="nm">${esc(t.ko)}<small>(${e.x}, ${e.y})${t.power&&!e.off?' · 전력 '+t.power:''}</small></span>${st}${TOGGLABLE.has(K(e.type)) ? `<label class="switch" title="켜기/끄기"><input type="checkbox" data-t="${e.id}" ${e.off?'':'checked'} aria-label="${esc(t.ko)} 켜기"></label>` : '<span></span>'}</div>`;
    }
  }
  if (!any) h += `<p class="note">${list.length ? '맞는 설비가 없습니다.' : '배치한 설비가 없습니다.'}</p>`;
  el.innerHTML = h;
  const fq = el.querySelector('#fq');
  fq.oninput = () => { renderFacs(); const n = $('#fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelectorAll('.frow').forEach(r => r.onclick = ev => {
    if (ev.target.closest('.switch')) return;
    const e = world.ents.get(+r.dataset.id); if (!e) return;
    setTool('select'); ui.sel = e.id; ui.multi.clear();
    focusOn(e.x + e.w/2, e.y + e.h/2, Math.max(ui.cam.z, 1.1)); renderInspector(true); renderSelbar(); renderFacs();
  });
  el.querySelectorAll('input[data-t]').forEach(i => i.onchange = () => { world.setOff(+i.dataset.t, !i.checked); markTouched(); renderFacs(); renderInspector(true); });
}
const MNAME = m => TYPES[m].ko;
function renderRecipes(){
  const machines = Object.keys(RECIPES_BY_M);
  $('#pane-recipes').innerHTML = `<div class="form"><label for="rf">설비</label><select id="rf"><option value="">전체</option>${machines.map(m => `<option value="${m}"${m==='refine'?' selected':''}>${esc(MNAME(m))}</option>`).join('')}</select><input id="rq" type="search" placeholder="재료 이름" aria-label="재료 이름으로 찾기" style="flex:1;min-width:100px"></div>
    <p class="note">분당 수치는 설비 1대가 쉬지 않고 돌 때 기준입니다. 벨트 1줄은 분당 30개, 파이프 1줄은 분당 120을 나릅니다.</p><div class="rlist" id="rl" style="margin-top:8px"></div>`;
  const draw = () => {
    const f = $('#rf').value, q = $('#rq').value.trim().toLowerCase();
    const list = RECIPES.filter(r => (!f || r.m===f) && (!q || [...Object.keys(r.in), ...Object.keys(r.out)].some(k => ITEMS[k].ko.toLowerCase().includes(q) || ITEMS[k].en.toLowerCase().includes(q))));
    $('#rl').innerHTML = list.slice(0, 120).map(r => {
      const per = 60 / r.t;
      const line = k => ITEMS[k].fluid ? 120 : 30;
      const ins = Object.entries(r.in).map(([k,n]) => `${ic(k,n)} <span class="dim">${fmt(n*per)}/분${n*per>line(k)?` · ${fmt(n*per/line(k))}줄`:''}</span>`).join('<br>');
      const outs = Object.entries(r.out).map(([k,n]) => `${ic(k,n)} <span class="dim">${fmt(n*per)}/분</span>`).join('<br>');
      return `<div class="rec" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center"><div>${ins}</div><span class="ar">→</span><div>${outs}</div><div class="t" style="grid-column:1/-1;margin:2px 0 0">${esc(MNAME(r.m))} · ${r.t}초</div></div>`;
    }).join('') + (list.length > 120 ? `<p class="note">${list.length}개 중 120개만 표시합니다. 재료 이름으로 좁혀 보세요.</p>` : '') + (!list.length ? '<p class="note">맞는 레시피가 없습니다.</p>' : '');
  };
  $('#rf').onchange = draw; $('#rq').oninput = draw; draw();
}
function renderPlan(){
  const targets = Object.keys(ITEMS).filter(k => !AIC.RAW.has(k) && ITEMS[k].cat!=='seed' && ITEMS[k].cat!=='filled' && AIC.producerOf(k)).sort(byCat);
  const pt = $('#pt'), prr = $('#pr');
  const cur = pt ? pt.value : 'buck_capsule_c', rate = prr ? prr.value : '6';
  $('#pane-plan').innerHTML = `<div class="form"><label for="pt">목표</label><select id="pt">${targets.map(k => `<option value="${k}"${k===cur?' selected':''}>${esc(ITEMS[k].ko)}</option>`).join('')}</select>
    <input id="pr" type="number" min="0.1" step="0.5" value="${esc(rate)}" aria-label="분당 생산량"><span class="dim">개/분</span></div><div id="pout"></div>`;
  const draw = () => {
    const item = $('#pt').value, r = Math.max(0, parseFloat($('#pr').value) || 0);
    const root = AIC.plan(item, r), raw = {}, mach = {};
    const node = n => {
      if (n.raw){ raw[n.item] = (raw[n.item]||0) + n.rate; return `<li><div class="n">${icS(n.item)} ${esc(ITEMS[n.item].ko)} <span class="r">${fmt(n.rate)}/분 · 원자재</span></div></li>`; }
      mach[n.recipe.m] = (mach[n.recipe.m]||0) + n.machines;
      const belts = n.rate/(ITEMS[n.item].fluid ? 120 : 30);
      return `<li><div class="n">${icS(n.item)} ${esc(ITEMS[n.item].ko)} <span class="r">${fmt(n.rate)}/분${belts>1?` · ${fmt(belts)}줄`:''}</span> <span class="m">${esc(MNAME(n.recipe.m))} ×${fmt(n.machines)}</span></div>${n.children.length?`<ul>${n.children.map(node).join('')}</ul>`:''}</li>`;
    };
    const tree = `<ul class="tree">${node(root)}</ul>`;
    let power = 0; for (const m in mach) power += Math.ceil(mach[m]-1e-9) * TYPES[m].power;
    $('#pout').innerHTML = tree + `<div class="tot"><div class="sub" style="margin-top:0">필요 설비 (올림)</div>${Object.entries(mach).map(([m,n]) => `<span class="mchip">${esc(MNAME(m))} ${Math.ceil(n-1e-9)}대</span>`).join('')}
      <div class="sub">원자재</div>${Object.entries(raw).map(([k,v]) => `<div>${ic(k)} <span class="dim">분당 ${fmt(v)} · 시간당 ${fmt(v*60)}</span></div>`).join('')}
      <p class="note">예상 전력 ${power} (PAC 기본 200). 한 품목을 만드는 레시피가 여럿이면 가장 기본적인 것으로 계산합니다.</p></div>`;
  };
  $('#pt').onchange = draw; $('#pr').oninput = draw; draw();
}

// ---------- loop ----------
let last = performance.now(), uiT = 0, statT = 0, saveT = 0;
function frame(now){
  const dt = Math.min(0.25, (now - last)/1000); last = now;
  if (ui.playing){
    ui.acc += dt * ui.speed;
    let n = 0; while (ui.acc >= 0.05 && n < 400){ world.step(0.05); ui.acc -= 0.05; n++; }
    if (n >= 400) ui.acc = 0;
  }
  render();
  if (now - uiT > 250){
    uiT = now;
    const p = world.power, over = p.demand > p.supply;
    $('#meter').classList.toggle('over', over);
    $('#meter i').style.width = Math.min(100, p.supply ? p.demand/p.supply*100 : 0) + '%';
    $('#pwrtxt').textContent = `${p.demand} / ${p.supply}`;
    const s = Math.floor(world.time), mm = Math.floor(s/60), ss = s%60;
    $('#clock').textContent = `T+${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    const w = $('#warn');
    if (over){ w.hidden = false; w.textContent = `전력 부족: 사용 ${p.demand} > 공급 ${p.supply}. 모든 설비가 ${Math.round(p.ratio*100)}% 속도로 돕니다.`; }
    else if (now > flashT) w.hidden = true;
    renderInspector(false);
  }
  if (now - statT > 1000){
    statT = now;
    const pane = ui.tab==='stats' ? $('#pane-stats') : ui.tab==='facs' ? $('#pane-facs') : null;
    if (pane && !pane.contains(document.activeElement)){ if (ui.tab==='stats') renderStats(); else renderFacs(); }
  }
  if (now - saveT > 6000){ saveT = now; if (ui.touched) store.saveLayout(); }
  requestAnimationFrame(frame);
}

const mq = matchMedia('(prefers-color-scheme: dark)');
const retheme = () => { readColors(); renderTools(); renderPalette(); renderInspector(true); renderStats(); renderRecipes(); renderPlan(); };
if (mq.addEventListener) mq.addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
window.addEventListener('resize', resize);
// save right away when the tab is closed, reloaded or hidden (the periodic save runs every 6 s)
const saveNow = () => { if (ui.touched) store.saveLayout(); };
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

readColors();
boot();
renderTools(); renderPalette();
syncSite(); fitView();
renderInspector(true); renderStats(); renderRecipes(); renderPlan();
store.init();
if (document.fonts) document.fonts.ready.then(() => render());
if (ui.oldSave) setTimeout(() => flash('PAC 포트 배치가 바뀌어 이전 공장 대신 예시 공장을 열었습니다. 청사진은 그대로 있습니다.'), 600);
requestAnimationFrame(frame);
})();

</script>
</body>
